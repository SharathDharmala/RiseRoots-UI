<!-- ================= HEADER ================= -->
<app-header
  [lang]="lang"
  [activeTab]="activeTab"
  (langChange)="onLangChange($event)"
  (tabChange)="onTabChange($event)"
>
</app-header>

<!-- ================= FESTIVAL BLAST ================= -->
<app-festival-blast *ngIf="festivalEffect" [effect]="festivalEffect" [message]="festivalMessage">
</app-festival-blast>

<!-- ================= MAIN CONTENT ================= -->
<main class="page-content">
  <router-outlet></router-outlet>
</main>

<!-- ================= FOOTER ================= -->
<app-footer [lang]="lang"></app-footer>
