<div *ngIf="visible" class="festival-blast">
  <div class="blast-overlay">
    <!-- EFFECT -->
    <div class="effect" [ngClass]="effect">
      <span *ngIf="effect === 'confetti'">🎊 🎉 🎊 🎉 🎊</span>
      <span *ngIf="effect === 'fireworks'">💥 ✨ 💥 ✨</span>
      <span *ngIf="effect === 'flowers'">🌸 🌼 🌺</span>
      <span *ngIf="effect === 'custom'">🚀 WELCOME TO RISEROOTS  🚀</span>
    </div>

    <!-- MESSAGE -->
    <div *ngIf="message" class="festival-message">
      {{ message }}
    </div>
  </div>
</div>
