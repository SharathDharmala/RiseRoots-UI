<header class="header">
  <div *ngIf="festivalMessage" class="festival-message">
    {{ festivalMessage }}
  </div>

  <div class="header-inner">
    <div class="brand">
      <img src="assets/logo/riseroots.png" alt="RiseRoots Logo" />
      <div class="brand-text">
        <div class="brand-name">RiseRoots Enterprises</div>
        <div class="brand-tagline">Grounded in excellence, rising with innovation</div>
      </div>
    </div>

    <div class="lang">
      <button [class.active]="lang === 'en'" (click)="switchLang('en')">EN</button>
      <button [class.active]="lang === 'te'" (click)="switchLang('te')">TE</button>
      <button [class.active]="lang === 'hi'" (click)="switchLang('hi')">HI</button>
    </div>
  </div>

  <nav class="tabs">
    <a routerLink="/services" [class.active]="activeSection === 'services'"> Our Services </a>
    <a routerLink="/real-estate" [class.active]="activeSection === 'real-estate'"> Real Estate </a>
    <button class="disabled-tab">…</button>
  </nav>
</header>
