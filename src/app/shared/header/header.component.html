<header class="header">

    <!-- FESTIVAL RIBBON (HEADER OWNED) -->
  <div *ngIf="festivalMessage" class="festival-message">
    {{ festivalMessage }}
  </div>
  
  <div class="header-inner">
    <div class="brand">
      <img src="assets/logo/riseroots.png" alt="RiseRoots Logo" />

      <div class="brand-text">
        <div class="brand-name">RiseRoots Enterprises</div>
        <div class="brand-tagline">Grounded in excellence and rising with innovation</div>
      </div>
    </div>

    <div class="lang">
      <button [class.active]="lang === 'en'" (click)="switchLang('en')">EN</button>

      <button [class.active]="lang === 'te'" (click)="switchLang('te')">TE</button>

      <button [class.active]="lang === 'hi'" (click)="switchLang('hi')">HI</button>
    </div>
  </div>

  <nav class="tabs">
    <button [class.active]="activeTab === 'services'" (click)="switchTab('services')">
      Our Services
    </button>

    <button [class.active]="activeTab === 'realestate'" (click)="switchTab('realestate')">
      Real Estate
    </button>

    <button (click)="switchTab('xyz')">...</button>
  </nav>
</header>
