<!-- ================= MAIN MODAL ================= -->
<div class="modal-backdrop" (click)="close()">
  <div class="modal" (click)="$event.stopPropagation()">
    <!-- ================= HEADER ================= -->
    <div class="modal-header">
      <h3>{{ title }}</h3>
      <button class="close-btn" (click)="close()">✕</button>
    </div>

    <!-- ================= BODY ================= -->
    <div
      class="modal-body"
      (mousedown)="onStart($event)"
      (mouseup)="onEnd($event)"
      (touchstart)="onStart($event)"
      (touchend)="onEnd($event)"
    >
      <!-- LEFT NAV -->
      <button class="nav left" [disabled]="currentIndex === 0" (click)="prev()">‹</button>

      <!-- WATERMARK -->
      <div class="watermark">RiseRoots</div>

      <!-- IMAGE -->
      <img
        *ngIf="currentIndex < media.length && getMediaType(media[currentIndex]) === 'image'"
        [src]="media[currentIndex]"
        class="slide-img"
        draggable="false"
        (dragstart)="$event.preventDefault()"
      />

      <!-- VIDEO -->
      <video
        *ngIf="currentIndex < media.length && getMediaType(media[currentIndex]) === 'video'"
        class="slide-video"
        [src]="media[currentIndex]"
        autoplay
        muted
        controls
        playsinline
      ></video>

      <!-- PDF -->
      <object
        *ngIf="currentIndex < media.length && getMediaType(media[currentIndex]) === 'pdf'"
        [data]="media[currentIndex]"
        type="application/pdf"
        class="slide-pdf"
      >
        <p class="pdf-fallback">
          PDF preview not supported.
          <a [href]="media[currentIndex]" target="_blank">Open PDF</a>
        </p>
      </object>

      <!-- UNSUPPORTED -->
      <div
        *ngIf="currentIndex < media.length && getMediaType(media[currentIndex]) === 'unknown'"
        class="unsupported"
      >
        Unsupported file format
      </div>

      <!-- 🔥 LEAVE A MESSAGE – MEDIA SLIDES CTA -->
      <div class="slider-cta" *ngIf="currentIndex < media.length">
        <button class="message-btn" (click)="openMessageModal('slider')">💬 Leave a Message</button>
      </div>

      <!-- ================= CONTACT SLIDE ================= -->
      <div *ngIf="currentIndex === media.length" class="contact-slide">
        <!-- SECTION 1 : QUESTION / MESSAGE -->
        <div class="contact-section section-question">
          <div class="contact-cta">
            <span>Have a question about this property?</span>
            <button class="message-btn" (click)="openMessageModal('contact')">
              💬 Leave a Message
            </button>
          </div>
        </div>

        <div class="contact-separator"></div>

        <!-- SECTION 2 : CALL / WHATSAPP -->
        <div class="contact-section section-call">
          <h3>Call or WhatsApp Us</h3>

          <div class="contact-wrapper">
            <!-- PHONE ROWS (UNCHANGED) -->
            <div class="contact-row" *ngFor="let group of contactGroups">
              <div class="contact-number">
                {{ group.value }}
              </div>

              <!-- DESKTOP ACTIONS -->
              <div class="contact-actions desktop-only">
                <a
                  *ngIf="group.callLink"
                  class="btn call"
                  [href]="group.callLink"
                  (click)="onCallClick(group.value)"
                >
                  Call
                </a>

                <a
                  *ngIf="group.whatsappLink"
                  class="btn whatsapp"
                  [href]="group.whatsappLink"
                  target="_blank"
                  rel="noopener"
                  (click)="onWhatsAppClick(group.value)"
                >
                  WhatsApp
                </a>
              </div>

              <!-- MOBILE ACTIONS -->
              <div class="contact-actions mobile-inline">
                <a
                  *ngIf="group.callLink"
                  class="icon-inline call"
                  [href]="group.callLink"
                  aria-label="Call"
                  (click)="onCallClick(group.value)"
                >
                  📞
                </a>

                <a
                  *ngIf="group.whatsappLink"
                  class="icon-inline whatsapp"
                  [href]="group.whatsappLink"
                  target="_blank"
                  aria-label="WhatsApp"
                  (click)="onWhatsAppClick(group.value)"
                >
                  <img src="assets/icons/watsapp.png" alt="WhatsApp" />
                </a>
              </div>
            </div>

            <!-- EMAIL FOOTER -->
            <div class="contact-footer" *ngFor="let email of visibleEmails">
              <a [href]="email.mailto"> ✉️ {{ email.label }} {{ email.value }} </a>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT NAV -->
      <button class="nav right" [disabled]="currentIndex === media.length" (click)="next()">
        ›
      </button>
    </div>

    <!-- ================= FOOTER ================= -->
    <div class="modal-footer">{{ currentIndex + 1 }} / {{ totalSlides }}</div>
  </div>
</div>

<!-- ================= 🔥 LEAVE MESSAGE POPUP (OUTSIDE MODAL) ================= -->
<app-leave-message *ngIf="showLeaveMessage" [context]="leadContext" (close)="closeLeaveMessage()">
</app-leave-message>
